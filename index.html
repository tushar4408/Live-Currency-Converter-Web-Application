<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #45a049;
            transform: scale(1.02);
        }

        .swap-btn {
            background: #007BFF;
            margin-bottom: 15px;
        }

        .swap-btn:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Currency Converter</h1>

        <form method="POST">

            <label>Amount:</label>
            <input type="number" name="amount" step="0.01" required>

            <label>From:</label>
            <select id="fromCurrency" name="from" required>
                {% for currency in currencies %}
                    <option value="{{ currency }}">
                        {{ currency }} - {{ currency_display[currency] }}
                    </option>
                {% endfor %}
            </select>

            <button type="button" class="swap-btn" onclick="swapCurrencies()">
                🔄 Swap
            </button>

            <label>To:</label>
            <select id="toCurrency" name="to" required>
                {% for currency in currencies %}
                    <option value="{{ currency }}">
                        {{ currency }} - {{ currency_display[currency] }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Convert</button>

        </form>

        {% if result %}
            <div class="result">
                {{ result }}
            </div>
        {% endif %}
    </div>

    <script>
        function swapCurrencies() {
            const from = document.getElementById("fromCurrency");
            const to = document.getElementById("toCurrency");

            const temp = from.value;
            from.value = to.value;
            to.value = temp;
        }
    </script>
</body>
</html>
